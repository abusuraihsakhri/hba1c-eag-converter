services:
  hba1c-eag-converter:
    build: .
    container_name: hba1c-eag-converter
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - AUDIT_SECRET_KEY=${AUDIT_SECRET_KEY:-}
      - AUDIT_LOGS_TOKEN=${AUDIT_LOGS_TOKEN:-}
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
