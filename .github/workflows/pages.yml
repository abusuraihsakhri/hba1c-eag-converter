name: Deploy browser converter

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run application tests
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q
          node --check web/app.js
          node --check web/converter.js
          node --test tests/test_browser_converter.cjs

  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the live HTML and JavaScript
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import os
          import time
          from urllib.request import urlopen

          site = os.environ["SITE_URL"].rstrip("/")
          for path, expected in (
              ("/", "HbA1c"),
              ("/converter.js", "ADAG"),
              ("/app.js", "converter-form"),
          ):
              for attempt in range(12):
                  try:
                      with urlopen(site + path, timeout=15) as response:
                          body = response.read().decode("utf-8")
                      if expected not in body:
                          raise RuntimeError("Unexpected site content")
                      print("Verified", site + path)
                      break
                  except Exception:
                      if attempt == 11:
                          raise
                      time.sleep(10)
          PY

  release:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish tagged release after verified deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v3.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v3.1.0 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "v3.1.0" \
              --notes "Browser-based HbA1c/eAG/IFCC conversion, corrected CLI and CSV calculations, expanded regression tests, and protected prototype audit logs."
          fi
