name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify dependencies
        run: python -m pip check
      - name: Compile sources
        run: python -m compileall -q agents cli.py enrichment.py hba1c_eag.py simulator.py
      - name: Run Python tests
        run: python -m pytest -q
      - name: Smoke-test installed CLI
        run: hba1c-eag single --ifcc 53
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax and regression tests
        run: |
          node --check web/converter.js
          node --check web/app.js
          node --test tests/test_browser_converter.cjs
